<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voronoi</title>
  </head>
  <body>
    <div id="app">
      <div id="controls">
        <div id="range-container">
          <label for="points-range">Number of points</label>
          <input
            type="range"
            id="points-range"
            name="points-range"
            min="1"
            max="16"
            value="8"
          />
          <span id="points-value">8</span>
        </div>
        <button type="button" id="regenerate">Generate</button>
      </div>
      <canvas width="800" height="600"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
